<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oxinab Driver</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#001765">
<link rel="manifest" href="/driver.webmanifest">
<link rel="icon" href="/icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/driver-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Oxinab Driver">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fa;--card:#fff;--tx:#0c1a3f;--mu:#56658a;--bd:#dbe3f0;--pr:#0573c4;--prd:#001765;--ok:#1fa855;--warn:#d97706;--bad:#c62828;--soft:#e5f2fb}
@media(prefers-color-scheme:dark){:root{--bg:#070f2a;--card:#0e1a3d;--tx:#e6edf8;--mu:#97a6c6;--bd:#1f2f5c;--soft:#132a55;color-scheme:dark}}
*{box-sizing:border-box}html,body{margin:0}
body{font:400 15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
button{font:inherit;cursor:pointer}
h1,h2,h3{font-family:Outfit,Manrope,sans-serif;margin:0}
.top{background:var(--prd);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;position:sticky;top:0;z-index:5}
.top .r{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.top img{width:34px;height:34px;border-radius:9px;background:#fff;padding:3px}
.top h1{font-size:18px;flex:1;line-height:1.15}.top h1 small{display:block;font:600 12.5px Manrope,sans-serif;opacity:.8}
.top button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:99px;padding:7px 12px;font-weight:700;font-size:13px}
main{max-width:640px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
input{width:100%;font:inherit;font-size:17px;padding:12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.big{width:100%;border:0;border-radius:14px;padding:15px;font-weight:700;font-size:16px;color:#fff;background:var(--prd);margin-top:14px}
.big.go{background:var(--pr)}.big.done{background:var(--ok)}.big:disabled{opacity:.55}
.err{color:var(--bad);font-weight:600;min-height:1.4em;margin:8px 0 0}
.mu{color:var(--mu)}.sm{font-size:13px}
.gps{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;background:var(--soft)}
.gps i{width:12px;height:12px;border-radius:50%;background:var(--mu);flex:none}
.gps.on i{background:#35d07f;box-shadow:0 0 0 0 rgba(53,208,127,.6);animation:p 1.6s infinite}.gps.warn{background:#fff4e5;color:#8a4b00}.gps.warn i{background:var(--warn)}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(53,208,127,0)}100%{box-shadow:0 0 0 0 rgba(53,208,127,0)}}
.job h3{font-size:19px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pill{font:700 12.5px Manrope,sans-serif;border-radius:99px;padding:4px 10px;background:var(--soft);color:var(--prd);white-space:nowrap}
.pill.out{background:#f1e6fa;color:#6a1b9a}.pill.delivered{background:#e3f6eb;color:#147a3d}.pill.cancelled{background:#fdecea;color:#b3261e}
.who{margin:10px 0 0;font-size:15px}.who b{font-size:16px}
.addr{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:15px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.acts a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:9px 4px;font-weight:700;font-size:13px}
.acts a span{font-size:20px}
details{margin-top:10px}summary{font-weight:700;cursor:pointer}
ul{margin:6px 0 0;padding-inline-start:20px}
.cash{display:flex;justify-content:space-between;font-weight:700;margin-top:8px;font-size:16px}
.done-l h3{font-size:16px}.done-l{opacity:.75}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}.empty span{font-size:42px;display:block}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#0c1a3f;color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header class="top"><div class="r"><img src="/icons/icon-192.png" alt=""><h1>Oxinab Driver<small id="who"></small></h1><button id="out" hidden>Sign out</button></div></header>
<main>
<section id="login" class="card" hidden>
<h2 style="font-size:20px">Sign in</h2>
<p class="mu sm" style="margin:4px 0 0">Use the phone number and PIN the Oxinab team gave you.</p>
<form id="lf"><label for="lp">Phone number</label><input id="lp" type="tel" autocomplete="tel" dir="ltr" required>
<label for="lpin">PIN</label><input id="lpin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" required>
<button class="big">Sign in</button><p class="err" id="lerr" role="alert"></p></form>
</section>
<section id="app" hidden>
<div class="gps" id="gps"><i></i><span id="gpst">Location is off. It turns on when you start a delivery.</span></div>
<div id="jobs"></div>
<p class="mu sm" id="upd" style="text-align:center"></p>
</section>
</main>
<script src="/driver.js" defer></script>
</body></html>
